name: Publish Packages
on:
  push:
    branches:
      - dev
      - main
      - v4/dev
      - v4/main
      - v5/dev
      - v5/main
      - v6/dev
      - v6/main
permissions:
  id-token: write
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Check Node version
        run: node -v
      - name: Update NPM version
        run: npm install -g "npm@^11.11.0"
      - name: Check NPM version
        run: npm -v
      - name: Compute release metadata
        id: meta
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            main | dev) track=v7 ;;
            v6/*) track=v6 ;;
            v5/*) track=v5 ;;
            v4/*) track=v4 ;;
          esac
          case "$ref" in
            dev) pre_id=next ;;
            v6/dev) pre_id=v6-next ;;
            v5/dev) pre_id=v5-next ;;
            v4/dev) pre_id=v4-next ;;
          esac
          case "$ref" in
            main) dist_tag=latest ;;
            v6/main) dist_tag=v6-latest ;;
            v5/main) dist_tag=v5-latest ;;
            v4/main) dist_tag=v4-latest ;;
          esac
          if [[ "$ref" == *dev ]]; then prod_branch="${ref%dev}main"; fi
          {
            echo "track=$track"
            echo "pre_id=$pre_id"
            echo "dist_tag=$dist_tag"
            echo "prod_branch=$prod_branch"
          } >> "$GITHUB_OUTPUT"
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm test
      - name: Install Playwright Browsers
        if: github.ref_name == 'dev'
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        if: github.ref_name == 'dev'
        run: npm run playwright:test
        timeout-minutes: 60
      - name: Configure NPM
        run: |
          git config --global user.name 'github-bot'
          git config --global user.email 'github-bot@users.noreply.github.com'
      - name: Check if Prerelease
        if: endsWith(github.ref_name, 'dev')
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: ".changeset/pre.json"
      - name: Enter Prerelease Mode
        if: endsWith(github.ref_name, 'dev') && steps.check_files.outputs.files_exists == 'false'
        run: |
          npx changeset pre enter "${{ steps.meta.outputs.pre_id }}"
          git add .changeset/pre.json
      - name: Exit Prerelease Mode
        if: endsWith(github.ref_name, 'main')
        run: |
          if [ -f .changeset/pre.json ]; then
            npm run version:exit
          fi
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          npm run version:pkgs
          if ! git diff --quiet; then
            if [[ "${GITHUB_REF_NAME}" == *dev ]]; then
              git commit -am "chore: enter prerelease mode"
            else
              git commit -am "chore: exit prerelease mode"
            fi
          fi
          if [[ "${GITHUB_REF_NAME}" == *main ]]; then
            npm run release -- --tag "${{ steps.meta.outputs.dist_tag }}"
          else
            npm run release
          fi
          git push --follow-tags
      - name: Get Alias
        id: info
        run: |
          echo "alias=$(npm run --silent getAlias)" >> "$GITHUB_OUTPUT"
          echo "version=$(npm run --silent getVersion)" >> "$GITHUB_OUTPUT"
      - name: Build Docs (Prerelease)
        if: endsWith(github.ref_name, 'dev')
        run: npm run build:docs
      - name: Build Docs (Versioned)
        if: endsWith(github.ref_name, 'main')
        run: npm run build:docs
        env:
          PATH_PREFIX: /version/${{ steps.info.outputs.version }}
      - name: Build Storybook
        run: npm run build-storybook
      - name: Chromatic (update baseline)
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        continue-on-error: true
        uses: chromaui/action@v16
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          autoAcceptChanges: true
      - name: Deploy Docs to Netlify (Prerelease)
        if: endsWith(github.ref_name, 'dev')
        uses: nwtgck/actions-netlify@v1.1
        with:
          publish-dir: './website/react-magma-docs/public'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          alias: ${{ steps.meta.outputs.pre_id }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Deploy Docs to Netlify (Versioned)
        if: endsWith(github.ref_name, 'main')
        uses: nwtgck/actions-netlify@v1.1
        with:
          publish-dir: './website/react-magma-docs/public'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          alias: ${{ steps.info.outputs.alias }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Deploy Dev Storybook to Netlify
        if: endsWith(github.ref_name, 'dev')
        uses: nwtgck/actions-netlify@v1.1
        with:
          publish-dir: './storybook-static'
          production-branch: ${{ steps.meta.outputs.prod_branch }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: false
          alias: storybook-preview-${{ steps.meta.outputs.track }}-dev
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Deploy Latest Storybook to Netlify
        if: endsWith(github.ref_name, 'main')
        uses: nwtgck/actions-netlify@v1.1
        with:
          publish-dir: './storybook-static'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          alias: storybook-${{ steps.meta.outputs.track }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Build Landing Page
        if: github.ref_name == 'main'
        run: npm run build:landing
      - name: Update landing page on Netlify
        if: github.ref_name == 'main'
        uses: nwtgck/actions-netlify@v1.1
        with:
          publish-dir: './website/react-magma-landing/dist'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy Landing page from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

