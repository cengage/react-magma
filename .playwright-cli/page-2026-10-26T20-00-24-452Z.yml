    - main [ref=f5e255]:
      - heading "Segmented Control" [level=1] [ref=f5e259]
      - article [ref=f5e260]:
        - generic [ref=f5e262]:
          - navigation [ref=f5e264]:
            - tablist [ref=f5e266]:
              - link "Code" [active] [ref=f5e267] [cursor=pointer]:
                - /url: /api/segmented-control/
              - link "Usage" [ref=f5e268] [cursor=pointer]:
                - /url: /design/segmented-control/
          - tabpanel [ref=f5e271]:
            - generic [ref=f5e272]:
              - paragraph [ref=f5e273]:
                - paragraph [ref=f5e274]: A Segmented Control lets users switch between a small set of views or filters of the same content. Exactly one option is always selected, and the change applies immediately.
              - separator [ref=f5e276]
              - heading "Anatomy" [level=2] [ref=f5e277]
              - figure [ref=f5e278]
              - list [ref=f5e280]:
                - listitem [ref=f5e281]: Container (track)
                - listitem [ref=f5e282]: Selected segment
                - listitem [ref=f5e283]: Unselected segment
                - listitem [ref=f5e284]: Label
                - listitem [ref=f5e285]: Icon (optional)
              - separator [ref=f5e286]
              - heading "When to Use" [level=2] [ref=f5e287]
              - paragraph [ref=f5e288]:
                - text: "A Segmented Control is easy to confuse with Tabs, Toggles, Radio buttons and Button Groups because they look alike. Ask one question:"
                - strong [ref=f5e289]: does choosing an option change how the same content is shown, right now?
                - text: If yes, use a Segmented Control. If not, use one of the components below.
              - table [ref=f5e293]:
                - rowgroup [ref=f5e294]:
                  - row [ref=f5e295]:
                    - columnheader "If you need to…" [ref=f5e296]
                    - columnheader "Use" [ref=f5e297]
                    - columnheader "Why not a Segmented Control" [ref=f5e298]
                - rowgroup [ref=f5e299]:
                  - row [ref=f5e300]:
                    - cell "Switch the view, filter, or sort of the same content" [ref=f5e301]
                    - cell "Segmented Control" [ref=f5e302]
                    - cell "—" [ref=f5e303]
                  - row [ref=f5e304]:
                    - cell "Move between different sections or pages" [ref=f5e305]
                    - cell "Tabs" [ref=f5e306]
                    - cell "Segments change the view of one set of content; they are not navigation" [ref=f5e307]
                  - row [ref=f5e308]:
                    - cell "Turn a single setting on or off" [ref=f5e309]
                    - cell "Toggle" [ref=f5e310]
                    - cell "A two-option control reads as two views, not an on/off state" [ref=f5e311]
                  - row [ref=f5e312]:
                    - cell "Pick several options at once" [ref=f5e313]
                    - cell "Toggle Button Group or Checkboxes" [ref=f5e314]
                    - cell "A Segmented Control always has exactly one option selected" [ref=f5e315]
                  - row [ref=f5e316]:
                    - cell "Choose a value that is saved later with a Submit or Save button" [ref=f5e317]
                    - cell "Radio" [ref=f5e318]
                    - cell "Segments apply immediately; they don't wait for a form to submit" [ref=f5e319]
                  - row [ref=f5e320]:
                    - cell "Trigger an action, such as Save or Delete" [ref=f5e321]
                    - cell "Button or ButtonGroup" [ref=f5e322]
                    - cell "Segments select a state; they don't perform actions" [ref=f5e323]
                  - row [ref=f5e324]:
                    - cell "Choose from more than seven options, or options with long labels" [ref=f5e325]
                    - cell "Select or Dropdown" [ref=f5e326]
                    - cell "Segments must stay short enough to fit on one line" [ref=f5e327]
              - paragraph [ref=f5e328]: A Segmented Control can sit inside a tab panel to filter or change the view of that tab's content.
              - separator [ref=f5e329]
              - heading "Options" [level=2] [ref=f5e330]
              - heading "Size" [level=3] [ref=f5e331]
              - paragraph [ref=f5e332]: Segmented Controls come in small, medium (default), and large. Each size matches the height of the Button of the same size, so the control lines up when placed next to Buttons in a toolbar. Use medium in most cases.
              - figure [ref=f5e333]
              - heading "Content" [level=3] [ref=f5e335]
              - paragraph [ref=f5e336]: Segments can show text, an icon with text, or an icon only. Use the same type of content for every segment in a control.
              - figure [ref=f5e337]
              - heading "Full Width" [level=3] [ref=f5e339]
              - paragraph [ref=f5e340]: By default, the control is only as wide as its content. Full width stretches it to fill its container and gives every segment the same width. Use it in narrow containers such as cards and side panels, and on mobile screens when every segment still fits on one line.
              - figure [ref=f5e341]
              - heading "Inverse" [level=3] [ref=f5e343]
              - paragraph [ref=f5e344]: Use the inverse style on dark backgrounds.
              - figure [ref=f5e345]
              - heading "Responsive" [level=3] [ref=f5e347]
              - paragraph [ref=f5e348]: On small screens, the control can switch to a dropdown button that shows the selected option, with a checkmark on the selected item in its menu. Use this when the segments won't fit on one line.
              - figure [ref=f5e349]
              - separator [ref=f5e351]
              - heading "Usage Guidelines" [level=2] [ref=f5e352]
              - heading "Change the view, not the page" [level=3] [ref=f5e353]
              - paragraph [ref=f5e354]: Use a Segmented Control to switch between views of the same content, such as a list and a grid of the same items. To move between separate sections or pages, use Tabs.
              - generic [ref=f5e356]:
                - figure [ref=f5e358]:
                  - generic [ref=f5e360]:
                    - paragraph [ref=f5e361]: Correct
                    - paragraph [ref=f5e362]: Switch between views of the same set of items.
                - figure [ref=f5e364]:
                  - generic [ref=f5e366]:
                    - paragraph [ref=f5e367]: Incorrect
                    - paragraph [ref=f5e368]:
                      - paragraph [ref=f5e369]: Don't use a Segmented Control to navigate between different pages or sections. Use Tabs.
              - heading "Don't use segments as actions" [level=3] [ref=f5e370]
              - paragraph [ref=f5e371]: Each segment represents a state that stays selected. If clicking it should do something, like saving or sharing, use Buttons.
              - figure [ref=f5e375]:
                - generic [ref=f5e377]:
                  - paragraph [ref=f5e378]: Incorrect
                  - paragraph [ref=f5e379]:
                    - paragraph [ref=f5e380]: Don't use segments for actions such as Save, Share, or Delete. Use a ButtonGroup.
              - heading "Keep it to two to five options" [level=3] [ref=f5e382]
              - paragraph [ref=f5e383]: Two to five options work best; seven is the maximum. With more options, or when the labels won't fit on one line, use a Select or Dropdown.
              - generic [ref=f5e385]:
                - figure [ref=f5e387]:
                  - generic [ref=f5e389]:
                    - paragraph [ref=f5e390]: Correct
                    - paragraph [ref=f5e391]: Use a few short options that fit comfortably.
                - figure [ref=f5e393]:
                  - generic [ref=f5e395]:
                    - paragraph [ref=f5e396]: Incorrect
                    - paragraph [ref=f5e397]: Don't squeeze many options into one control.
              - heading "Always select an option" [level=3] [ref=f5e398]
              - paragraph [ref=f5e399]: The content below the control always reflects one choice, so one option should be selected when the page loads. Choose the option most people need, usually the first one.
              - generic [ref=f5e401]:
                - figure [ref=f5e403]:
                  - generic [ref=f5e405]:
                    - paragraph [ref=f5e406]: Correct
                    - paragraph [ref=f5e407]: Select a sensible default.
                - figure [ref=f5e409]:
                  - generic [ref=f5e411]:
                    - paragraph [ref=f5e412]: Incorrect
                    - paragraph [ref=f5e413]: Don't leave every option unselected.
              - heading "Write short, parallel labels" [level=3] [ref=f5e414]
              - paragraph [ref=f5e415]: Use one or two words per label, written as nouns in sentence case, and keep the labels parallel in form. Labels describe the view, not an action.
              - generic [ref=f5e417]:
                - figure [ref=f5e419]:
                  - generic [ref=f5e421]:
                    - paragraph [ref=f5e422]: Correct
                    - paragraph [ref=f5e423]: Use short nouns that follow the same pattern.
                - figure [ref=f5e425]:
                  - generic [ref=f5e427]:
                    - paragraph [ref=f5e428]: Incorrect
                    - paragraph [ref=f5e429]: Don't use long labels, verbs, or mismatched wording.
              - heading "Use one type of content" [level=3] [ref=f5e430]
              - paragraph [ref=f5e431]: Use text, icons with text, or icons only, and use the same type for every segment. Use icons only when they are widely understood, and show their names in a tooltip.
              - generic [ref=f5e433]:
                - figure [ref=f5e435]:
                  - generic [ref=f5e437]:
                    - paragraph [ref=f5e438]: Incorrect
                    - paragraph [ref=f5e439]: Don't mix icon-only segments with text segments.
                - figure [ref=f5e441]:
                  - generic [ref=f5e443]:
                    - paragraph [ref=f5e444]: Caution
                    - paragraph [ref=f5e445]:
                      - paragraph [ref=f5e446]: Icon-only controls need familiar icons. Turn on tooltips so people can confirm what each icon means.
              - heading "Use the right control for on/off, multiple, and saved choices" [level=3] [ref=f5e447]
              - paragraph [ref=f5e448]: A Segmented Control selects one view that applies immediately. For a single on/off setting, use a Toggle. When people can pick several options, use a Toggle Button Group or Checkboxes. When a choice is saved later with a Submit or Save button, use Radio buttons.
              - generic [ref=f5e449]:
                - generic [ref=f5e450]:
                  - figure [ref=f5e452]:
                    - generic [ref=f5e454]:
                      - paragraph [ref=f5e455]: Incorrect
                      - paragraph [ref=f5e456]: Don't use On and Off segments for a setting. Use a Toggle.
                  - figure [ref=f5e458]:
                    - generic [ref=f5e460]:
                      - paragraph [ref=f5e461]: Incorrect
                      - paragraph [ref=f5e462]:
                        - paragraph [ref=f5e463]: Don't use it when people need to pick several options. Use a Toggle Button Group.
                - figure [ref=f5e466]:
                  - generic [ref=f5e468]:
                    - paragraph [ref=f5e469]: Incorrect
                    - paragraph [ref=f5e470]:
                      - paragraph [ref=f5e471]: Don't use it in a form that is saved with a button. Use Radio buttons.
              - heading "Place it next to the content it controls" [level=3] [ref=f5e473]
              - paragraph [ref=f5e474]: Place the control directly above the content it changes, aligned to the left edge of that content, so the connection is obvious. Use one Segmented Control per set of content.
              - generic [ref=f5e475]:
                - generic [ref=f5e476]:
                  - figure [ref=f5e478]:
                    - generic [ref=f5e480]:
                      - paragraph [ref=f5e481]: Correct
                      - paragraph [ref=f5e482]: Place the control directly above the content it changes.
                  - figure [ref=f5e484]:
                    - generic [ref=f5e486]:
                      - paragraph [ref=f5e487]: Incorrect
                      - paragraph [ref=f5e488]: Don't place the control far from the content it changes.
                - figure [ref=f5e491]:
                  - generic [ref=f5e493]:
                    - paragraph [ref=f5e494]: Incorrect
                    - paragraph [ref=f5e495]:
                      - paragraph [ref=f5e496]: Don't stack or nest Segmented Controls for the same content. Combine the choices or use a different component.
              - heading "Plan for small screens" [level=3] [ref=f5e498]
              - paragraph [ref=f5e499]: Keep every segment on one line. When the labels won't fit, switch to the dropdown display instead of wrapping or shrinking the text.
              - generic [ref=f5e501]:
                - figure [ref=f5e503]:
                  - generic [ref=f5e505]:
                    - paragraph [ref=f5e506]: Caution
                    - paragraph [ref=f5e507]:
                      - paragraph [ref=f5e508]: In full-width controls, long labels are cut off. Shorten them so the full text stays visible.
                - figure [ref=f5e510]:
                  - generic [ref=f5e512]:
                    - paragraph [ref=f5e513]: Incorrect
                    - paragraph [ref=f5e514]: Don't wrap segments onto a second line.
              - separator [ref=f5e515]
              - heading "Common Mistakes" [level=2] [ref=f5e516]
              - paragraph [ref=f5e517]: "Before using a Segmented Control, check that none of these apply:"
              - list [ref=f5e518]:
                - listitem [ref=f5e519]:
                  - strong [ref=f5e520]: Using it as navigation.
                  - text: Moving between pages or sections calls for Tabs.
                - listitem [ref=f5e521]:
                  - strong [ref=f5e522]: Using it for actions.
                  - text: Save, Share and Delete are Buttons.
                - listitem [ref=f5e523]:
                  - strong [ref=f5e524]: Using it as an on/off switch.
                  - text: A single setting calls for a Toggle.
                - listitem [ref=f5e525]:
                  - strong [ref=f5e526]: Allowing several selections.
                  - text: Multiple choices call for a Toggle Button Group or Checkboxes.
                - listitem [ref=f5e527]:
                  - strong [ref=f5e528]: Using it in a form with a Save button.
                  - text: Choices saved later call for Radio buttons.
                - listitem [ref=f5e529]:
                  - strong [ref=f5e530]: Leaving nothing selected.
                  - text: One option should always be selected.
                - listitem [ref=f5e531]:
                  - strong [ref=f5e532]: Adding too many options.
                  - text: Keep to two to five, and never more than seven.
                - listitem [ref=f5e533]:
                  - strong [ref=f5e534]: Writing long or mismatched labels.
                  - text: Use one or two parallel nouns.
                - listitem [ref=f5e535]:
                  - strong [ref=f5e536]: Mixing icons and text.
                  - text: Use one type of content for every segment.
                - listitem [ref=f5e537]:
                  - strong [ref=f5e538]: Placing it far from its content.
                  - text: Keep it directly above what it changes.
                - listitem [ref=f5e539]:
                  - strong [ref=f5e540]: Disabling options without explanation.
                  - text: If an option is unavailable, explain why nearby, or remove it.
              - separator [ref=f5e541]
              - heading "Accessibility" [level=2] [ref=f5e542]
              - list [ref=f5e543]:
                - listitem [ref=f5e544]:
                  - strong [ref=f5e545]: Give the control a name.
                  - text: Every Segmented Control needs a label that says what it changes, such as "Time range." It can be visible text or hidden for screen readers only.
                - listitem [ref=f5e546]:
                  - strong [ref=f5e547]: Keyboard.
                  - text: People press Tab to move into the control, the arrow keys to change the selection, and Tab again to leave.
                - listitem [ref=f5e548]:
                  - strong [ref=f5e549]: Icon-only segments.
                  - text: Each icon needs a text label for screen readers, and a tooltip helps sighted users.
                - listitem [ref=f5e550]:
                  - strong [ref=f5e551]: Selected state.
                  - text: The selected segment is shown by its fill and shadow. Check that the selected option stays clear to people with low vision, and don't rely on color alone in custom designs.
                - listitem [ref=f5e552]:
                  - strong [ref=f5e553]: Motion.
                  - text: The selected background slides when clicked. It doesn't animate for people who have turned on reduced motion.
              - separator [ref=f5e554]
              - heading "Related Components" [level=2] [ref=f5e555]
              - list [ref=f5e556]:
                - listitem [ref=f5e557]:
                  - strong [ref=f5e558]: Tabs
                  - text: ": move between separate sections of content."
                - listitem [ref=f5e559]:
                  - strong [ref=f5e560]: Toggle
                  - text: ": turn a single setting on or off."
                - listitem [ref=f5e561]:
                  - strong [ref=f5e562]: Toggle Button Group
                  - text: ": select one or several formatting options, such as text alignment or bold."
                - listitem [ref=f5e563]:
                  - strong [ref=f5e564]: Radio
